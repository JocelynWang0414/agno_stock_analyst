<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Trace Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #171b26;
    --border:    #242836;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --accent:    #6366f1;

    --workflow:  #0ea5e9;
    --step:      #6366f1;
    --agent-in:  #f59e0b;
    --agent-out: #10b981;
    --data-flow: #8b5cf6;
    --parallel:  #ec4899;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Drop zone ──────────────────────────────────────────── */
  #drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100%;
    border: 2px dashed var(--border);
    border-radius: 16px;
    margin: 32px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(99,102,241,.05);
  }
  #drop-zone svg { opacity: .4; }
  #drop-zone p { color: var(--muted); font-size: 15px; }
  #drop-zone strong { color: var(--text); }
  #file-input { display: none; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }

  /* ── App shell ──────────────────────────────────────────── */
  #app { display: none; flex-direction: column; height: 100%; }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
  }
  .logo { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
  .logo span { color: var(--accent); }
  .meta-pill {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta-pill b { color: var(--text); }
  .spacer { flex: 1; }
  #load-another { font-size: 13px; }

  /* ── Filters ────────────────────────────────────────────── */
  #filters {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .filter-chip {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: opacity .15s;
    background: transparent;
    color: var(--muted);
  }
  .filter-chip.active { color: #fff; border-color: transparent; }
  .filter-chip[data-type="WORKFLOW_START"],.filter-chip[data-type="WORKFLOW_END"] { --c: var(--workflow); }
  .filter-chip[data-type="STEP_START"],.filter-chip[data-type="STEP_END"]         { --c: var(--step); }
  .filter-chip[data-type="AGENT_INPUT"]                                            { --c: var(--agent-in); }
  .filter-chip[data-type="AGENT_OUTPUT"]                                           { --c: var(--agent-out); }
  .filter-chip[data-type="DATA_FLOW"]                                              { --c: var(--data-flow); }
  .filter-chip[data-type="PARALLEL_START"],.filter-chip[data-type="PARALLEL_END"] { --c: var(--parallel); }
  .filter-chip.active { background: var(--c, var(--accent)); }

  /* ── Main pane split ────────────────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Timeline ───────────────────────────────────────────── */
  #timeline {
    width: 420px;
    min-width: 320px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  #timeline::-webkit-scrollbar { width: 4px; }
  #timeline::-webkit-scrollbar-track { background: transparent; }
  #timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .event-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
    position: relative;
  }
  .event-row:hover { background: rgba(255,255,255,.03); }
  .event-row.selected { background: rgba(99,102,241,.12); }
  .event-row.hidden { display: none; }

  .event-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .event-row .left { flex: 1; min-width: 0; }
  .event-actor { font-size: 13px; font-weight: 600; color: var(--text); }
  .event-summary { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .event-type-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .4px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 4px;
  }

  /* ── Detail panel ───────────────────────────────────────── */
  #detail {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-track { background: transparent; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  #detail-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 14px;
  }

  #detail-content { display: none; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .detail-title { font-size: 18px; font-weight: 700; }
  .detail-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .field-block .field-key {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field-block .field-value {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* simple markdown rendering */
  .md h1, .md h2, .md h3 { margin: 12px 0 6px; font-weight: 700; }
  .md h2 { font-size: 15px; color: var(--text); }
  .md h3 { font-size: 13px; color: var(--muted); }
  .md p  { margin: 6px 0; }
  .md ul, .md ol { padding-left: 20px; margin: 6px 0; }
  .md li { margin: 3px 0; }
  .md strong { color: #fff; }
  .md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--bg); font-weight: 600; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .md code { background: var(--bg); border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 12px; }

  /* ── Colour helpers ─────────────────────────────────────── */
  .c-workflow  { color: var(--workflow); }
  .c-step      { color: var(--step); }
  .c-agent-in  { color: var(--agent-in); }
  .c-agent-out { color: var(--agent-out); }
  .c-data-flow { color: var(--data-flow); }
  .c-parallel  { color: var(--parallel); }

  .bg-workflow  { background: var(--workflow); }
  .bg-step      { background: var(--step); }
  .bg-agent-in  { background: var(--agent-in); }
  .bg-agent-out { background: var(--agent-out); }
  .bg-data-flow { background: var(--data-flow); }
  .bg-parallel  { background: var(--parallel); }

  /* ── Flow diagram ───────────────────────────────────────── */
  #flow-section { margin-bottom: 24px; }
  .flow-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 4px;
  }
  .flow-node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .flow-arrow {
    color: var(--muted);
    font-size: 16px;
    padding: 0 6px;
    line-height: 1;
  }
  .flow-parallel {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 12px;
    border: 1px dashed var(--parallel);
    border-radius: 8px;
  }
  .flow-parallel-label {
    font-size: 10px;
    color: var(--parallel);
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  /* ── Timeline bar ───────────────────────────────────────── */
  .timing-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .timing-bar {
    height: 100%;
    border-radius: 2px;
    min-width: 2px;
  }
</style>
</head>
<body>

<!-- ── Drop zone ──────────────────────────────────────────── -->
<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/>
    <line x1="9" y1="15" x2="15" y2="15"/>
  </svg>
  <p><strong>Drop a trace JSON file here</strong></p>
  <p>or click to browse</p>
  <button class="btn" onclick="event.stopPropagation();document.getElementById('file-input').click()">Choose file</button>
  <input type="file" id="file-input" accept=".json">
</div>

<!-- ── App ────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="logo">Agent<span>Trace</span></div>
    <div class="meta-pill" id="meta-sector"></div>
    <div class="meta-pill" id="meta-tickers"></div>
    <div class="meta-pill" id="meta-duration"></div>
    <div class="meta-pill" id="meta-events"></div>
    <div class="spacer"></div>
    <button class="btn" id="load-another" onclick="resetApp()">Load another</button>
  </header>

  <div id="filters"></div>

  <div id="main">
    <div id="timeline"></div>
    <div id="detail">
      <div id="detail-placeholder">← Select an event to inspect</div>
      <div id="detail-content"></div>
    </div>
  </div>
</div>

<script>
// ── Utilities ─────────────────────────────────────────────────────────────────

function typeClass(type) {
  if (type.startsWith('WORKFLOW'))  return 'workflow';
  if (type.startsWith('STEP'))      return 'step';
  if (type === 'AGENT_INPUT')       return 'agent-in';
  if (type === 'AGENT_OUTPUT')      return 'agent-out';
  if (type === 'DATA_FLOW')         return 'data-flow';
  if (type.startsWith('PARALLEL'))  return 'parallel';
  return 'step';
}

function typeLabel(type) {
  const map = {
    WORKFLOW_START: 'Start', WORKFLOW_END: 'End',
    STEP_START: 'Step ▶', STEP_END: 'Step ■',
    AGENT_INPUT: 'Input', AGENT_OUTPUT: 'Output',
    DATA_FLOW: 'Flow',
    PARALLEL_START: 'Par ▶', PARALLEL_END: 'Par ■',
  };
  return map[type] || type;
}

// Minimal markdown → HTML
function renderMd(text) {
  if (!text) return '';
  let html = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // tables
    .replace(/^\|(.+)\|$/gm, (m) => {
      const cells = m.split('|').slice(1,-1).map(c => c.trim());
      return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    })
    .replace(/(<tr>.*<\/tr>\n?)+/g, m => `<table>${m}</table>`)
    // headers
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    // bold
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    // hr
    .replace(/^---+$/gm,'<hr>')
    // bullets
    .replace(/^\s*[*-] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    // line breaks
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>');
  return `<div class="md"><p>${html}</p></div>`;
}

function fmt(s) {
  // Try to detect if it looks like markdown prose
  if (typeof s !== 'string') s = JSON.stringify(s, null, 2);
  const looksLikeMarkdown = /\*\*|^#+\s|^[-*]\s/m.test(s);
  if (looksLikeMarkdown) return renderMd(s);
  return `<div class="field-value">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>`;
}

// ── State ─────────────────────────────────────────────────────────────────────

let traceData = null;
let activeFilters = new Set();
let selectedSeq = null;

// ── File loading ──────────────────────────────────────────────────────────────

const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const appEl     = document.getElementById('app');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      traceData = JSON.parse(e.target.result);
      renderApp();
    } catch {
      alert('Could not parse JSON. Make sure this is a valid trace file.');
    }
  };
  reader.readAsText(file);
}

function resetApp() {
  traceData = null; activeFilters = new Set(); selectedSeq = null;
  appEl.style.display = 'none';
  dropZone.style.display = 'flex';
  fileInput.value = '';
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderApp() {
  dropZone.style.display = 'none';
  appEl.style.display = 'flex';

  const events = traceData.events || [];
  const totalDuration = events.length ? events[events.length - 1].elapsed_s : 0;

  // Meta pills
  const firstEv = events[0] || {};
  const sector  = (firstEv.detail && firstEv.detail.sector) || '—';
  const tickers = (firstEv.detail && firstEv.detail.tickers) || [];
  document.getElementById('meta-sector').innerHTML   = `Sector <b>${sector.toUpperCase()}</b>`;
  document.getElementById('meta-tickers').innerHTML  = `Tickers <b>${tickers.join(', ')}</b>`;
  document.getElementById('meta-duration').innerHTML = `Duration <b>${totalDuration.toFixed(2)}s</b>`;
  document.getElementById('meta-events').innerHTML   = `Events <b>${events.length}</b>`;

  renderFilters(events);
  renderTimeline(events, totalDuration);
  renderFlowDiagram(events);
}

function renderFilters(events) {
  const types = [...new Set(events.map(e => e.type))];
  const container = document.getElementById('filters');
  container.innerHTML = '';

  // All chip
  const all = document.createElement('button');
  all.className = 'filter-chip active';
  all.textContent = 'All';
  all.dataset.type = 'ALL';
  all.style.setProperty('--c', 'var(--accent)');
  all.addEventListener('click', () => {
    activeFilters.clear();
    container.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.type === 'ALL'));
    applyFilters();
  });
  container.appendChild(all);

  types.forEach(type => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.textContent = type.replace('_', ' ');
    chip.dataset.type = type;
    chip.addEventListener('click', () => {
      if (activeFilters.has(type)) activeFilters.delete(type);
      else activeFilters.add(type);
      chip.classList.toggle('active', activeFilters.has(type));
      // deactivate ALL chip if any specific filter is on
      all.classList.toggle('active', activeFilters.size === 0);
      applyFilters();
    });
    container.appendChild(chip);
  });
}

function applyFilters() {
  document.querySelectorAll('.event-row').forEach(row => {
    const type = row.dataset.type;
    const hide = activeFilters.size > 0 && !activeFilters.has(type);
    row.classList.toggle('hidden', hide);
  });
}

function renderTimeline(events, totalDuration) {
  const container = document.getElementById('timeline');
  container.innerHTML = '';

  events.forEach(ev => {
    const cls = typeClass(ev.type);
    const row = document.createElement('div');
    row.className = 'event-row';
    row.dataset.seq  = ev.seq;
    row.dataset.type = ev.type;

    // Indent DATA_FLOW and AGENT_* slightly
    const isIndented = ev.type.startsWith('AGENT') || ev.type === 'DATA_FLOW';

    // Timing bar width (proportional to total)
    const barPct = totalDuration > 0 ? Math.max(2, (ev.elapsed_s / totalDuration) * 100) : 2;

    row.innerHTML = `
      <div class="event-dot bg-${cls}" style="${isIndented ? 'margin-left:12px' : ''}"></div>
      <div class="left">
        <div class="event-actor">${escHtml(ev.actor)}</div>
        <div class="event-summary">${escHtml(ev.summary)}</div>
        <div class="event-meta">#${ev.seq} · ${ev.elapsed_s.toFixed(3)}s</div>
        <div class="timing-bar-wrap">
          <div class="timing-bar bg-${cls}" style="width:${barPct}%"></div>
        </div>
      </div>
      <div class="event-type-badge bg-${cls}" style="color:#fff;opacity:.9">${typeLabel(ev.type)}</div>
    `;

    row.addEventListener('click', () => selectEvent(ev));
    container.appendChild(row);
  });
}

function renderFlowDiagram(events) {
  // Build a simple static flow diagram from the trace actors
  const actors = [...new Set(events.filter(e => e.type === 'STEP_START' || e.type === 'AGENT_OUTPUT')
    .map(e => e.actor))];
  // We'll render the known static flow from CLAUDE.md topology
}

function selectEvent(ev) {
  // Deselect previous
  document.querySelectorAll('.event-row.selected').forEach(r => r.classList.remove('selected'));
  const row = document.querySelector(`.event-row[data-seq="${ev.seq}"]`);
  if (row) row.classList.add('selected');

  selectedSeq = ev.seq;
  const cls = typeClass(ev.type);

  document.getElementById('detail-placeholder').style.display = 'none';
  const dc = document.getElementById('detail-content');
  dc.style.display = 'block';

  // Build detail HTML
  let detailHTML = `
    <div class="detail-header">
      <div class="event-dot bg-${cls}" style="width:12px;height:12px;margin-top:0"></div>
      <div>
        <div class="detail-title">${escHtml(ev.actor)}</div>
        <div class="detail-subtitle">${ev.type} · event #${ev.seq} · ${ev.elapsed_s.toFixed(3)}s elapsed</div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="stat-card">
        <div class="stat-label">Event</div>
        <div class="stat-value c-${cls}" style="font-size:14px">${ev.type}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Timestamp</div>
        <div class="stat-value" style="font-size:13px">${ev.timestamp.replace('T',' ')}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Elapsed</div>
        <div class="stat-value">${ev.elapsed_s.toFixed(3)}s</div>
      </div>
    </div>

    <div class="section-label">Summary</div>
    <div class="field-block">
      <div class="field-value">${escHtml(ev.summary)}</div>
    </div>
  `;

  if (ev.detail && Object.keys(ev.detail).length > 0) {
    detailHTML += `<div class="section-label" style="margin-top:16px">Detail</div>`;

    for (const [key, val] of Object.entries(ev.detail)) {
      const strVal = typeof val === 'string' ? val : JSON.stringify(val, null, 2);
      const rendered = fmt(strVal);
      detailHTML += `
        <div class="field-block">
          <div class="field-key">${escHtml(key)}</div>
          ${rendered}
        </div>
      `;
    }
  }

  dc.innerHTML = detailHTML;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
